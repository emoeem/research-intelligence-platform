# B1 批次登记文件：rip.text.embed（TOOL-INVENTORY T03，ROADMAP P1-7a）。
# worker 事实核对：embedding_worker.py:247-248（NAME=embedding-worker，VERSION=0.2.0）、
# 56 行 MAX_BATCH=64、60 行 MAX_TEXT_CHARS=1000000、62 行双后端词表。
# V-1 裁决记录（TOOL-INVENTORY 待验证项 6，ROADMAP §14 V-1）：模型权重上游许可证
# 经 ModelScope API 实测：GET modelscope.cn/api/v1/models/BAAI/bge-small-zh-v1.5
# 返回 Data.License=mit；本仓 ONNX 导出源 onnx-community/bge-small-zh-v1.5-ONNX
# 的 Data.BaseModel=[BAAI/bge-small-zh-v1.5]（BaseModelRelation=finetune），
# 下载出处见 docs/M8_TAIL_EMBEDDING_REPORT.md:28。
schema_version: "1"
id: "rip.text.embed"
name: "Text Embedder"
version: "0.2.0"
kind: "tool"
family: "knowledge"
description: "双后端文本向量化：hashing-ngram-v1 确定性 256 维基线与 bge-small-zh-v1.5 ONNX 512 维语义向量，L2 归一化"
runtime:
  type: "python_worker"
  protocol_version: "1"
  worker_name: "embedding-worker"
  command: ["python3", "-I", "workers/python/embedding_worker.py"]
  working_dir: "repo://research-platform"
  restart: "pooled"
input_schema:
  type: "object"
  additionalProperties: false
  oneOf:
    - required: ["text"]
    - required: ["texts"]
  properties:
    text:
      type: "string"
      maxLength: 1000000
      description: "单条文本，上限 100 万字符（MAX_TEXT_CHARS），与 texts 二选一"
    texts:
      type: "array"
      minItems: 1
      maxItems: 64
      items:
        type: "string"
        maxLength: 1000000
      description: "批量文本，上限 64 条（MAX_BATCH），与 text 二选一"
    model:
      type: "string"
      enum: ["hashing-ngram-v1", "bge-small-zh-v1.5"]
      description: "缺省 hashing-ngram-v1；bge 需 models/ 模型目录就绪"
    dim:
      type: "integer"
      minimum: 1
      description: "显式维度协商，必须等于所选后端输出维度（hash=256，bge=512），不静默错维"
    ngram_range:
      type: "array"
      minItems: 2
      maxItems: 2
      items:
        type: "integer"
        minimum: 1
      description: "仅 hashing-ngram-v1 后端支持的 ngram 区间"
output_schema:
  type: "object"
  required: ["model", "backend", "dim", "deterministic", "vectors"]
  properties:
    model:
      type: "string"
    backend:
      type: "string"
      description: "hash / onnx:bge-small-zh-v1.5 / hash-fallback（请求真实模型不可用时的回退标注）"
    dim:
      type: "integer"
      description: "实际输出维度（与后端绑定）"
    deterministic:
      type: "boolean"
    vectors:
      type: "array"
      items:
        type: "object"
      description: "每条 {index, dim, nnz, l2_norm, vector}"
resources:
  cpu: "1"
  memory: "1Gi"
  timeout_seconds: 120
  max_output_bytes: 8388608
network:
  mode: "none"
secrets: []
permission_level: "T0"
idempotent: true
health:
  probe:
    type: "worker_ping"
    timeout_ms: 2000
    interval_seconds: 300
    degraded_after: 1
    broken_after: 3
  on_run_recover: true
provenance:
  origin: "rip-native"
  source_path: "workers/python/embedding_worker.py"
  license: "repo-internal"
  model_license: "MIT（BAAI/bge-small-zh-v1.5；经 ModelScope API 实测 2026-11-09，ONNX 导出源 onnx-community/bge-small-zh-v1.5-ONNX）"
  dependencies:
    - "bge-small-zh-v1.5 模型权重（BAAI，MIT，V-1 已裁决，见 model_license 与文件头裁决记录）"
    - "onnxruntime（仅真实模型后端需要，位于仓库 workers/python/.venv）"
  known_limits:
    - "models/ 目录不入库，模型缺失时回退 hash 后端并标注 backend=hash-fallback"
    - "批量上限 64 条（MAX_BATCH=64），单条上限 100 万字符（MAX_TEXT_CHARS）"
    - "维度与后端绑定（hash=256，bge=512），显式 dim 冲突时 -32602 拒绝"
  tested: "workers/python/tests 125 项全绿（2026-11-09 本会话重跑 SUMMARY ok=True exit=0，覆盖双后端与维度协商）"
context:
  summary: "文本向量化：确定性 hash 基线与 bge 512 维语义向量"
  docs: "workers/python/embedding_worker.py 模块头注"
  tags: ["embedding", "vector", "knowledge"]
examples:
  - input:
      text: "示例文本一段。"
      model: "hashing-ngram-v1"
    output_hint:
      model: "hashing-ngram-v1"
      dim: 256
      deterministic: true
