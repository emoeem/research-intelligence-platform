# cargo-deny 许可证合规配置（P10-4，docs/phase10/DEPENDENCIES-RUST.md）。
# 工具口径：cargo-deny 0.20.2（EmbarkStudios 维护的成熟许可证/依赖审计工具，
# 用户级安装 ~/.cargo/bin，不属于 workspace 依赖，vendor 零增量）。
# 运行：仓库根 `cargo deny check licenses`（读 Cargo.lock + vendor/ 实装源，
# 离线可跑）；输出 JSON 版本 `cargo deny check licenses --format json`。
# 允许清单 = 逐包实装值的超集（弱著作权与许可型许可证，具体清单见批次报告）；
# 任何 GPL/AGPL/LGPL 类强著作权或未知许可（unlicensed）一律 deny。

[graph]
# 全图（含 dev-dependencies 与 build-dependencies）：许可证合规对整棵依赖树生效。
all-features = true

[licenses]
version = 2
# workspace 自有 crate 已在 Cargo.toml 标 publish = false（私有工程线，不发布
# crates.io），经 private.ignore = true 排除出许可证审计面：本清单只约束
# 第三方依赖树（第三方未声明许可 = 不匹配 allow 清单 = deny，fail-closed）。
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
  # WSW-0 POC 批 vendor 增量补录（2026-11-18 评审修订）：cargo deny check licenses
  # 实测 9 error——ISC（aws-lc-rs/aws-lc-sys/rustls-webpki/untrusted 组合表达式）、
  # BSD-2-Clause（hyper-tungstenite）、BSD-3-Clause（ring/subtle 组合表达式）、
  # CDLA-Permissive-2.0（webpki-roots 0.26.11/1.0.12，Mozilla 根证书库数据许可）。
  # 实录见 docs/rip3/wsw/04-ADR.md §四.3。
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]
# 信任 crates.io 元数据（vendor/ 内 Cargo.toml 的 license 字段与 crates.io
# 一致，manifest 逐包人工抽样核对记录在 DEPENDENCIES-RUST.md）。
confidence-threshold = 0.93

[advisories]
version = 2
ignore = [
  # 三条 unmaintained 裁决（SEC-0，docs/phase0/SEC-0-ADVISORIES-DECISION.md，2026-11-20）：
  # 均为 INFO 级无修复版本；替代面已逐条实测，见各条尾注。复查统一 2027-05-20。
  "RUSTSEC-2026-0543", # chrono unmaintained：纯传递（rmcp 3.10.0），workspace 零直用；替代=跨 rmcp 生态（§1）
  "RUSTSEC-2024-0436", # paste unmaintained：纯传递（tokenizers 0.21.4），proc-macro 无运行时暴露（§2）
  "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained：经 serde_yaml_ng（直接依赖）；bump 无效，serde-saphyr 替换属独立批次候选（§3）
]
# RUSTSEC-2026-0459（libsqlite3-sys / CVE-2026-119375）不 ignore：vulnerability 有修复线，
# 由 SEC-0-TASK.md rusqlite 0.41.1 bump 消除，验收 = cargo deny check advisories exit 0。
