name: CI

# 推送与 PR 的最小质量门：Rust workspace（离线 vendored 构建）+ Python worker 测试
# + Web 工作台（npm 构建 + vitest）。浏览器视觉门禁按 V-9 保持本地执行（需浏览器
# 二进制与已验收基线）；容器端到端按 V-9 保持受控环境执行（镜像属运行时数据）。
# migrations/verify.py 不在 CI 内跑：它对账的源快照与 dryrun 库含生产衍生数据，不入库；
# 该对账在本地执行并以 sources-snapshot manifest 为准。
# P10-3/P10-4 门随 workspace 全量测试生效（rust job `cargo test --offline --workspace`）：
# runtime-gateway multi_runner_failover（双 Runner 调度、主节点离线转投备用、恢复续跑）
# 与 tool-engine security_matrix（T0/T1/T2 越界拒绝矩阵 + secrets 不泄露核查，D-TC-06）。
# 性能基准（#[ignore] bench_assemble_latency / bench_dispatch_latency）按 P10-4 口径
# 保持本地执行（autoresearch 载具，见 docs/phase10/PERF-BASELINE.md），不进 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL migrations and Phase 7 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RP_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/rip_test
      RP_REQUIRE_PG_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.99.1

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-postgres-${{ hashFiles('Cargo.lock') }}

      - name: 安装 PostgreSQL Python 驱动
        run: python3 -m pip install "psycopg[binary]>=3,<4"

      - name: Build RIP PostgreSQL 17 image
        run: docker build -t rip-pg17-test -f containerfiles/rip-pg17/Dockerfile containerfiles/rip-pg17/

      - name: Start RIP PostgreSQL 17
        run: |
          docker run -d --name rip-pg17-test \
            -e POSTGRES_DB=rip_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:5432:5432 \
            rip-pg17-test
          for i in $(seq 1 60); do
            if docker exec rip-pg17-test pg_isready -U postgres -d rip_test >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs rip-pg17-test
          exit 1

      - name: Phase 7 PostgreSQL integration tests
        run: cargo test --offline -p intel-db --test phase7_maintenance -- --test-threads=1

      - name: PostgreSQL source monitor smoke
        run: python3 scripts/tests/phase7_source_monitor_pg_smoke.py

      - name: PostgreSQL backup and recovery gate
        run: python3 scripts/rip_pg_recovery_gate.py --dsn "$RP_TEST_PG_DSN"

      - name: PostgreSQL migration and Phase 7 test count
        run: cargo test --offline -p intel-db --test phase7_maintenance -- --test-threads=1

  rust:
    name: Rust workspace（测试与 clippy 零警告）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 测试（离线 vendored）
        run: cargo test --offline --workspace

      - name: clippy 零警告
        run: cargo clippy --offline --workspace --all-targets -- -D warnings

  # P9-4 协议一致性载具（ROADMAP §10.5 风险 1 常驻门禁，不是一次性验收）：
  # 五个业务操作对 REST（rp_server.py 真实 HTTP 进程）与 MCP（mcp-server 协议
  # 面）两通道断言同一输出形状与同一审计链。runner 自带 python3（rp_server
  # 与 worker 依赖）；rp-workflow 二进制由载具内 ensure_bin 按 --offline 构建。
  parity:
    name: 协议一致性载具（REST vs MCP 双通道）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.99.1

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.lock') }}

      - name: 双通道一致性断言（cargo test --offline -p rp-mcp-parity）
        run: cargo test --offline -p rp-mcp-parity

  python-workers:
    name: Python worker 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 Source Monitor Python 驱动
        run: python3 -m pip install "psycopg[binary]>=3,<4"

      # RT-2 lock 完整性静态校验（纯 stdlib，零安装面保持——A11 分工纪律）：
      # 校验 requirements.lock.txt 每包 ≥1 sha256 哈希、直接依赖与 .in 钉定一致、无 .. 穿越。
      # CI 不装依赖、不跑 uv、不碰 venv（RT-2-ADR-VENV-GOVERNANCE.md D8.2）。
      - name: lock 完整性校验（RT-2）
        working-directory: workers/python
        run: python -m unittest tests.test_lock_integrity -v

      - name: 运行 worker 测试
        working-directory: workers/python
        run: python -m unittest discover -s tests -v

  browser:
    name: Browser visual and accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Install CJK browser fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
      - name: Run visual and accessibility tests
        working-directory: web
        run: npm run test:visual:gate

  security:
    name: Repository and dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Repository secret and artifact scan
        run: python3 scripts/rip_quality_repo_scan.py
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Cargo dependency advisory scan
        run: cargo audit

  performance-smoke:
    name: SQLite performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded benchmark
        run: python3 scripts/rip3_phase8_sqlite_compare.py --docs 1000 --chunks-per-doc 10 --workers 4 --queries 20 --output-dir /tmp/rip-quality-bench

  web:
    name: Web 工作台（构建与 vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 测试
        working-directory: web
        run: npm run test
