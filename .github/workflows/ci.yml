name: CI

# 推送与 PR 的最小质量门：Rust workspace（离线 vendored 构建）+ Python worker 测试
# + Web 工作台（npm 构建 + vitest）。浏览器视觉门禁按 V-9 保持本地执行（需浏览器
# 二进制与已验收基线）；容器端到端按 V-9 保持受控环境执行（镜像属运行时数据）。
# migrations/verify.py 不在 CI 内跑：它对账的源快照与 dryrun 库含生产衍生数据，不入库；
# 该对账在本地执行并以 sources-snapshot manifest 为准。
# P10-3/P10-4 门随 workspace 全量测试生效（rust job `cargo test --offline --workspace`）：
# runtime-gateway multi_runner_failover（双 Runner 调度、主节点离线转投备用、恢复续跑）
# 与 tool-engine security_matrix（T0/T1/T2 越界拒绝矩阵 + secrets 不泄露核查，D-TC-06）。
# 性能基准（#[ignore] bench_assemble_latency / bench_dispatch_latency）按 P10-4 口径
# 保持本地执行（autoresearch 载具，见 docs/phase10/PERF-BASELINE.md），不进 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace（测试与 clippy 零警告）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 测试（离线 vendored）
        run: cargo test --offline --workspace

      - name: clippy 零警告
        run: cargo clippy --offline --workspace --all-targets -- -D warnings

  # P9-4 协议一致性载具（ROADMAP §10.5 风险 1 常驻门禁，不是一次性验收）：
  # 五个业务操作对 REST（rp_server.py 真实 HTTP 进程）与 MCP（mcp-server 协议
  # 面）两通道断言同一输出形状与同一审计链。runner 自带 python3（rp_server
  # 与 worker 依赖）；rp-workflow 二进制由载具内 ensure_bin 按 --offline 构建。
  parity:
    name: 协议一致性载具（REST vs MCP 双通道）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.lock') }}

      - name: 双通道一致性断言（cargo test --offline -p rp-mcp-parity）
        run: cargo test --offline -p rp-mcp-parity

  python-workers:
    name: Python worker 测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行 worker 测试
        working-directory: workers/python
        run: python -m unittest discover -s tests -v

  web:
    name: Web 工作台（构建与 vitest）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 测试
        working-directory: web
        run: npm run test
