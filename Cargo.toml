[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/database",
    "crates/audit-engine",
    "crates/resource-engine",
    "crates/search-engine",
    "crates/unified-search",
    "crates/quality-engine",
    "crates/tool-registry",
    "crates/tool-engine",
    "crates/runtime-gateway",
    "crates/context-broker",
    "crates/plugin-registry",
    "crates/plugin-runtime",
    "crates/agent-engine",
    "crates/research-engine",
    "crates/verification-engine",
    "crates/workflow-engine",
    "crates/mcp-server",
    "crates/rp-mcp-parity",
    "crates/intel-db",
    "crates/wsw-message",
    "crates/wsw-runtime",
    "crates/wsw-poc",
    "crates/document-router",
    "crates/report-engine",
    "tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
authors = ["RIP core team"]

[workspace.dependencies]
# 依赖锁定最少集（DEC-001 / PROBE-RESULT.md 约定：rusqlite bundled 免系统 sqlite）。
# backup feature（P10-1）：rusqlite 自带 backup 模块（Online Backup API 快照，
# 纯 Rust 门控模块，bundled libsqlite3-sys 内置完整 SQLite，无新增 C 依赖与
# 无新增 vendor）；P10-5 backup() 用它做 WAL 一致快照。
# SEC-0 bump（0.32 → 0.41.1，RUSTSEC-2026-0459 修复线：rusqlite 0.41.x 首条
# 带动 libsqlite3-sys ^0.39.0 即 bundles SQLite 3.54.1）：default-features=false
# 关掉 0.41 默认的 ffi-sqlite-wasm-rs（wasm 后端，本仓无 wasm target，避免无谓
# vendor 增量）；cache feature 显式补回 prepare_cached（plugin-runtime ingest
# 两处调用依赖，default-features=false 会失去默认的 cache）；fallible_uint
# 恢复 0.38 起默认关闭的 u64/usize FromSql（retention.rs COUNT(*) 读出位，
# 语义与 0.32 相同：> i64::MAX fallible）。
# 选型记录 docs/phase0/SEC-0-TASK.md §1。
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup", "cache", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# YAML 解析（P6-1 起仓库首个 yaml 依赖；本仓 Cargo.lock 与 vendor 此前 grep
# 实测零 yaml 条目）。选型 serde_yaml_ng 0.10：dtolnay serde_yaml 0.9 的
# 维护中 fork（原版 2024-10 归档停更），保留 serde 数据模型、duplicate key
# 拒绝与 error 语义，MSRV 1.64；YAML 解析属通用逻辑，按复用优先纪律不手写。
serde_yaml_ng = "0.10"

# MCP 官方 Rust SDK（rmcp 迁移批次采用，选型记录 docs/phase9/RMCP-MIGRATION.md）：
# crates.io 发布版 3.10.0（2026-11-12 发布，不跟 git main），MSRV 1.88，
# Apache-2.0；stdio server 面最小 feature 集（default-features=false 只带
# server + transport-io，不引入 base64/macros 与 client/auth/elicitation/
# HTTP 传输），版本号经实际构建与测试验证后锁定。
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
# tokio：rmcp server 的 async 运行时面（bin rp-mcp 的 async main + stdio
# transport 拉起）；feature 按本仓实际使用取子集，与 rmcp 自身 tokio 要求统一。
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

# RIP3 情报核 PG 依赖（ADR-0001，P1-1）：同步栈（现有 crates 无 tokio，13 号
# 文档与 12-STORAGE 定稿口径）。选型与版本记录 docs/rip3/decisions/ADR-0002。
postgres = { version = "0.19", features = ["with-serde_json-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
# refinery：PG 迁移执行（同步、每文件事务、checksum），migrations_pg/ 目录。
refinery = { version = "0.8", features = ["postgres"] }
# pgvector Rust 类型映射（vector(512) 列的 ToSql/FromSql）。
pgvector = { version = "0.4", features = ["postgres"] }

# WSW-1 消息模型五项协议钉版 + 两项工具依赖（ADR-0004 §四.5 零 vendor 增量）：
# 五项协议依赖与 sha2/base64 均已在 Cargo.lock/vendor；sha2/base64 作为本 crate
# 的直接依赖钉选既有版本，不增加 registry package。http* 承载 Parsed 结构化表示，
# httparse 承载 wire 级解析，bytes 承载 Wire/Outbound 原始字节新类型。
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
httparse = "=1.10.1"
bytes = "=1.12.2"
# wsw_body_blob CAS sha256（migrations/005_tool_contract.sql:86 小写 hex 口径）；
# lock 已有 0.10.9 与 0.11.1 双版本，等号钉选定 0.10.9，零 vendor 增量。
sha2 = "=0.10.9"
# Wire/Outbound 原始字节与体字节的 JSON 往返编码（fixtures 期望 JSON 同口径）；
# lock 已有 0.13.1 与 0.22.1 双版本，等号钉选定 0.22.1，零 vendor 增量。
base64 = "=0.22.1"

# Report IR 渲染 crate（PHASE-6A D3 单 crate 裁决——原双 crate 中 docx-rs
# 于实施日停批撤除：其 0.4.22（crates.io latest）硬依赖 zip ^8.6.0，advisory DB
# 实测 6 条 vulnerability error 级 RUSTSEC（0367/0368/0369/0429/0545/0546）命中
# 且 patched 全部 >=9.0.0 被 ^8.6.0 约束堵死，deny advisories 门不可达；裁决
# 半撤保 comrak，DOCX 渲染顺延 6b 重新侦察（实录 docs/phase0/PHASE-6A-BATCH-REPORT.md）。
# comrak =1.1.0（crates.io latest；BSD-2-Clause；MSRV 1.89 < workspace 1.99；
# default-features=false 剥 cli/syntect-onig/bon——零 clap/零 syntect/零 shell-words）
# 承载 markdown→HTML 片段面。exact 钉 = rmcp/chromiumoxide vendor 跃迁批先例。
comrak = { version = "=1.1.0", default-features = false }

# workspace 内部依赖（模块边界见 security-research-upgrade/architecture-2.0/MODULE_BOUNDARIES.md §8）
domain = { path = "crates/domain" }
database = { path = "crates/database" }
audit-engine = { path = "crates/audit-engine" }
resource-engine = { path = "crates/resource-engine" }
search-engine = { path = "crates/search-engine" }
intel-db = { path = "crates/intel-db" }
unified-search = { path = "crates/unified-search" }
quality-engine = { path = "crates/quality-engine" }
tool-registry = { path = "crates/tool-registry" }
tool-engine = { path = "crates/tool-engine" }
# DI-1 ADR D1：文档域编排层（Router 只消费两 crate 公开面，不进 tool-engine
# 内模块——层次倒挂否决项见 D1；成员条目进 lock 是常态事实，wsw-message 同款）。
document-router = { path = "crates/document-router" }
runtime-gateway = { path = "crates/runtime-gateway" }
context-broker = { path = "crates/context-broker" }
plugin-registry = { path = "crates/plugin-registry" }
plugin-runtime = { path = "crates/plugin-runtime" }
agent-engine = { path = "crates/agent-engine" }


[profile.release]
# 商业化基线：体积与 panic 行为显式声明
strip = "debuginfo"
