[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/database",
    "crates/audit-engine",
    "crates/resource-engine",
    "crates/search-engine",
    "crates/quality-engine",
    "crates/tool-registry",
    "crates/tool-engine",
    "crates/runtime-gateway",
    "crates/context-broker",
    "crates/plugin-registry",
    "crates/plugin-runtime",
    "crates/agent-engine",
    "crates/research-engine",
    "crates/workflow-engine",
    "crates/mcp-server",
    "crates/rp-mcp-parity",
    "tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
authors = ["RIP core team"]

[workspace.dependencies]
# 依赖锁定最少集（DEC-001 / PROBE-RESULT.md 约定：rusqlite bundled 免系统 sqlite）
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# YAML 解析（P6-1 起仓库首个 yaml 依赖；本仓 Cargo.lock 与 vendor 此前 grep
# 实测零 yaml 条目）。选型 serde_yaml_ng 0.10：dtolnay serde_yaml 0.9 的
# 维护中 fork（原版 2024-10 归档停更），保留 serde 数据模型、duplicate key
# 拒绝与 error 语义，MSRV 1.64；YAML 解析属通用逻辑，按复用优先纪律不手写。
serde_yaml_ng = "0.10"

# MCP 官方 Rust SDK（rmcp 迁移批次采用，选型记录 docs/phase9/RMCP-MIGRATION.md）：
# crates.io 发布版 3.10.0（2026-11-12 发布，不跟 git main），MSRV 1.88，
# Apache-2.0；stdio server 面最小 feature 集（default-features=false 只带
# server + transport-io，不引入 base64/macros 与 client/auth/elicitation/
# HTTP 传输），版本号经实际构建与测试验证后锁定。
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
# tokio：rmcp server 的 async 运行时面（bin rp-mcp 的 async main + stdio
# transport 拉起）；feature 按本仓实际使用取子集，与 rmcp 自身 tokio 要求统一。
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

# workspace 内部依赖（模块边界见 security-research-upgrade/architecture-2.0/MODULE_BOUNDARIES.md §8）
domain = { path = "crates/domain" }
database = { path = "crates/database" }
audit-engine = { path = "crates/audit-engine" }
resource-engine = { path = "crates/resource-engine" }
search-engine = { path = "crates/search-engine" }
quality-engine = { path = "crates/quality-engine" }
tool-registry = { path = "crates/tool-registry" }
tool-engine = { path = "crates/tool-engine" }
runtime-gateway = { path = "crates/runtime-gateway" }
context-broker = { path = "crates/context-broker" }
plugin-registry = { path = "crates/plugin-registry" }
plugin-runtime = { path = "crates/plugin-runtime" }
agent-engine = { path = "crates/agent-engine" }


[profile.release]
# 商业化基线：体积与 panic 行为显式声明
strip = "debuginfo"
