# ============================================================================
# rip.core.file_meta：Core Utilities Pack Manifest（P3-4 批次交付物）
# ============================================================================
# 五 Manifest 共用 coreutils 镜像与 core_tools.py 入口（argv op 分派：
# entrypoint 第三位 = file_meta）；json 孪生 rip.core.file_meta.json（Registry
# 加载用），两者内容一致；image digest 为本机实建镜像真实值（podman inspect
# 实测，containerfiles/README.md digest 台账同步）。
# ============================================================================
schema_version: "1"
kind: "tool"
family: "utility"
runtime:
  type: "podman_host"
  image: "localhost/rip-tool-coreutils:latest@sha256:49436f71b66974631ffc4ea7ac805c95bfa07d4d5fb00423c3d5c7ea9b18acaf"
  readonly_rootfs: true
  mounts:
      role: "input"
      path: "/task/in"
      mode: "ro"
      role: "output"
      path: "/task/out"
      mode: "rw"
  entrypoint:
    - "python3"
    - "/app/core_tools.py"
    - "file_meta"
resources:
  cpu: "2"
  memory: "2Gi"
  pid_limit: 256
  disk_mb: 256
  timeout_seconds: 120
  max_output_bytes: 1048576
network:
  mode: "none"
secrets: []
permission_level: "T1"
health:
  probe:
    type: "exec"
    command:
      - "python3"
      - "-c"
      - "import json; print(json.dumps({'ok': True}))"
    timeout_ms: 5000
    interval_seconds: 600
    degraded_after: 1
    broken_after: 3
  on_run_recover: true
provenance:
  origin: "rip-native"
  source_repo: "containerfiles/rip-tool-coreutils（本仓库，自研纯标准库入口）"
  license: "repo-internal"
  dependencies: []
  image_digest: "sha256:49436f71b66974631ffc4ea7ac805c95bfa07d4d5fb00423c3d5c7ea9b18acaf"
  known_limits:
    - "YAML 无关；目录输入不计算 sha256"
  tested: "P3-4 批次端到端实测（crates/tool-engine/tests/core_utils_e2e.rs：五 run 经 Gateway::dispatch 全链 + artifact sha256 对账 + 坏输入/截断负例）"
context:
  summary: "Core Utilities：RIP Core File Meta"
  tags:
    - "utility"
    - "podman_host"
    - "p3-4"
id: "rip.core.file_meta"
name: "RIP Core File Meta"
version: "0.1.0"
description: "Core Utilities Pack（计划 §14:776）：共用 coreutils 镜像与 core_tools.py 入口（argv op 分派），纯标准库，network.mode=none 纯本地变换：路径元数据与 magic 字节嗅探类型（size/mtime/sha256/type）"
input_schema:
  type: "object"
  required:
    - "path"
  additionalProperties: false
  properties:
    path:
      type: "string"
      description: "/task/in 之下的输入文件路径"
output_schema:
  type: "object"
  required:
    - "name"
    - "size_bytes"
    - "type"
  properties:
    name:
      type: "string"
    path:
      type: "string"
    is_dir:
      type: "boolean"
    is_symlink:
      type: "boolean"
    size_bytes:
      type: "integer"
    mtime:
      type: "integer"
    sha256:
      type: "string"
    type:
      type: "string"
    mime_guess:
      type: "string"
    tool:
      type: "string"
    elapsed_ms:
      type: "integer"
    uid:
      type: "integer"
idempotent: true
examples:
    input:
      path: "/task/in/sample.txt"
    output_hint:
      name: "sample.txt"
      type: "text"
      size_bytes: 31
