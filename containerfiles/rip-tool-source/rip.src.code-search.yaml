# ============================================================================
# rip.src.code-search：Source Analysis Pack Manifest（收尾武器库批交付物）
# ============================================================================
# 三 Manifest 共用 source 镜像与 src_tools.py 入口（argv op 分派：
# entrypoint 第三位 = search）；json 孪生 rip.src.code-search.json（Registry
# 加载用），两者内容一致；image digest 为本机实建镜像真实值（podman inspect
# 实测 2026-11-14，containerfiles/README.md digest 台账同步）。
# ============================================================================
"schema_version": "1"
"kind": "tool"
"family": "source_code"
"runtime":
  "type": "podman_host"
  "image": "localhost/rip-tool-source:latest@sha256:8251ba32e6ae4d107190f2b2279ae3774facdc8e074ae000266be3aa1fd0ea29"
  "readonly_rootfs": true
  "mounts":
    - "role": "input"
      "path": "/task/in"
      "mode": "ro"
    - "role": "output"
      "path": "/task/out"
      "mode": "rw"
  "entrypoint":
    - "python3"
    - "/app/src_tools.py"
    - "search"
"resources":
  "cpu": "2"
  "memory": "2Gi"
  "pid_limit": 256
  "disk_mb": 256
  "timeout_seconds": 120
  "max_output_bytes": 1048576
"network":
  "mode": "none"
"secrets": []
"permission_level": "T1"
"health":
  "probe":
    "type": "exec"
    "command":
      - "python3"
      - "-c"
      - "import json; print(json.dumps({'ok': True}))"
    "timeout_ms": 5000
    "interval_seconds": 600
    "degraded_after": 1
    "broken_after": 3
  "on_run_recover": true
"provenance":
  "origin": "rip-native"
  "source_repo": "containerfiles/rip-tool-source（本仓库，自研纯标准库入口）"
  "license": "repo-internal"
  "dependencies": []
  "image_digest": "sha256:8251ba32e6ae4d107190f2b2279ae3774facdc8e074ae000266be3aa1fd0ea29"
  "known_limits":
    - "5000 文件与 200 命中双截断护栏；max_matches 上限 200"
  "tested": "收尾武器库批实测（容器内三 op 冒烟 + crates/tool-engine/tests/src_analysis_e2e.rs ensure_image digest 守卫 V-9 + workers/python/tests/test_src_tools.py 宿主纯函数单测）"
"context":
  "summary": "Source Analysis：代码搜索"
  "tags":
    - "source_code"
    - "podman_host"
    - "closure-arsenal"
"id": "rip.src.code-search"
"name": "RIP Source Code Search"
"version": "0.1.0"
"description": "Source Analysis Pack：目录限定 regex 代码搜索（include/exclude glob、大小写开关、max_matches 截断、二进制与超限跳过），返回 file/line/excerpt；纯标准库，network.mode=none 只读"
"input_schema":
  "type": "object"
  "required":
    - "path"
    - "pattern"
  "additionalProperties": false
  "properties":
    "path":
      "type": "string"
      "description": "/task/in 之下的目录或文件"
    "pattern":
      "type": "string"
      "description": "Python 正则（re.compile 语义）"
    "include":
      "type": "array"
      "items":
        "type": "string"
      "description": "相对路径 glob 白名单"
    "exclude":
      "type": "array"
      "items":
        "type": "string"
      "description": "相对路径 glob 黑名单"
    "case_insensitive":
      "type": "boolean"
      "default": false
    "max_matches":
      "type": "integer"
      "default": 200
      "maximum": 200
"output_schema":
  "type": "object"
  "required":
    - "target"
    - "matches"
    - "files_scanned"
    - "count"
  "properties":
    "target":
      "type": "string"
    "matches":
      "type": "array"
      "items":
        "type": "object"
        "properties":
          "file":
            "type": "string"
          "line":
            "type": "integer"
          "excerpt":
            "type": "string"
    "files_scanned":
      "type": "integer"
    "count":
      "type": "integer"
    "truncated":
      "type": "boolean"
    "output_file":
      "type": "string"
    "tool":
      "type": "string"
    "elapsed_ms":
      "type": "integer"
    "uid":
      "type": "integer"
"idempotent": true
"examples":
  - "input":
      "path": "/task/in/src"
      "pattern": "TODO|FIXME"
      "include":
        - "*.py"
    "output_hint":
      "count": 1
      "files_scanned": 3
