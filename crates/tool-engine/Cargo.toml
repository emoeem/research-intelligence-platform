[package]
publish = false  # 私有工程线（P10-4：cargo-deny [licenses] private.ignore 口径）
name = "tool-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Phase 1 工具引擎骨架：ToolCallRequest 受理（D-TC-05 提交校验）、ToolRun 状态机（TOOL-CONTRACT §3.2 十三条跃迁）、ToolRunResult 信封（§5，含 §5.4 截断对齐）与 Mock Runner（可注入四路径 + WAITING_FOR_RUNNER）"

[dependencies]
database = { workspace = true }
domain = { workspace = true }
tool-registry = { workspace = true }
# SK-3 文档抓取审计记录（document_fetch.rs FetchRecord 序列化面）。
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
# P3-3 端到端经 Gateway::dispatch 派发（不绕过 Gateway 直调 Adapter）；
# dev-dep 环允许（runtime-gateway 正常依赖 tool-engine）。
runtime-gateway = { workspace = true }

[[bin]]
name = "rp-tool-health"
path = "src/bin/rp-tool-health.rs"

[[bin]]
name = "rp-knowledge-fetch"
path = "src/bin/rp-knowledge-fetch.rs"

[[bin]]
# P10-2：镜像 digest 台账 CLI（ADR §6 镜像回滚语义命令载具）。
name = "rp-image-pin"
path = "src/bin/rp-image-pin.rs"
