[package]
name = "document-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Document Router：文档域编排层（DI-1 ADR D1）——手写魔数嗅探（D6）→ 通道表编排（D3）→ 能力/帽前置门（D7）→ 规范化（D3 统一输出 Schema）。执行链复用 tool-engine 公开 API（D2：零 std::process::Command，不建第二事实源）。"

[dependencies]
# DI-1 ADR D1 依赖面：tool-engine（公开 API execute_native_rust_via_engine /
# StaticCatalogProvider）+ tool-registry（hash::sha256_hex 对账面）+ serde/
# serde_json（统一输出 Schema 序列化）。零新外部依赖（sha2 等均已在
# Cargo.lock/vendor，本 crate 不新增 registry package——WSW-1 同款先例，
# lock 总条目唯一允许增量 = 本成员自身条目 399→400）。
tool-engine = { workspace = true }
# ToolRunStatus 终态判别（terminal_reject 链级失败映射；domain 在 lock 在册）。
domain = { workspace = true }
tool-registry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# e2e 载具：真实 ToolRun 行需要内存库迁移 + Registry 登记（判据 1-3）+
# ToolRunStatus 终态断言。
database = { workspace = true }
domain = { workspace = true }
