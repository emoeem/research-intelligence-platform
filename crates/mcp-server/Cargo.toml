[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Phase 9 平台 MCP server（bin rp-mcp，stdio NDJSON JSON-RPC 2.0，MCP 2024-11-05 子集）：P9-1 握手鉴权（RP_MCP_TOKEN 环境变量，禁止匿名）+ tools/list 分页目录 + rip.get_tool_schema 按需 Schema；P9-2 rip.run_tool 端到端执行通道（经 tool-engine Engine 受理 D-TC-05 与既有适配器派发，python_worker 走 execute_via_engine、podman 走 Gateway::dispatch + execute_container_via_engine，不建第二套派发逻辑）与 rip.get_run_status / rip.cancel_run 运行面；结构化结果 + Artifact + Evidence 登记复用 agent-engine EvidenceRegistrar（P7-2 同一实现）；目录与 Schema 与 Tool Center 同源（同一 tool 表读面，aux 增量合并同 rp_server.py handle_tools 口径），rip.* 命名空间，初始化只暴露目录与分页发现不暴露工具完整说明（计划 §11:658）；形态参考 integrations/rtis/rtis_mcp.mjs 但代码独立，零新增外部依赖（全部为 workspace 既有 crate，vendor 无 rmcp/tokio）"

[dependencies]
# 依赖面（复用优先纪律）：serde/serde_json 走 workspace 既有条目；数据库读面
# 复用 database::Pool（rusqlite bundled 随链，只读打开 SQLITE_OPEN_READ_ONLY），
# 不直接依赖 rusqlite（先例：各 engine 只依赖 database，rusqlite 经其重导出）。
# 协议层零新增第三方 crate：JSON-RPC 2.0 与 MCP 2024-11-05 子集为薄协议层，
# 手写派发（rmcp/tokio 不在 vendor，引入即破坏 --offline 构建红线）。
# P9-2 执行通道依赖（均为 workspace 既有 crate，零新增外部依赖）：
# tool-engine（Engine 受理/状态机/信封 + adapter 驱动）、tool-registry
# （Registry + Manifest 解析复用面）、domain（RunId/ToolRunStatus/RuntimeNode）、
# runtime-gateway（容器路径 Gateway::dispatch 心跳判定，P3-3 同款）、
# agent-engine（EvidenceRegistrar，P7-2 最小闭环同一登记实现）、
# serde_yaml_ng（Manifest yaml 登记件解析，tls_inspect 系只有 yaml）。
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
database = { workspace = true }
domain = { workspace = true }
tool-registry = { workspace = true }
tool-engine = { workspace = true }
runtime-gateway = { workspace = true }
agent-engine = { workspace = true }

[[bin]]
name = "rp-mcp"
path = "src/bin/rp-mcp.rs"
