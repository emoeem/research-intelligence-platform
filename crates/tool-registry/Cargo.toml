[package]
publish = false  # 私有工程线（P10-4：cargo-deny [licenses] private.ignore 口径）
name = "tool-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Phase 1 工具注册表：Manifest 校验九条（TOOL-CONTRACT §2.5）+ tool/tool_version 读写面（沿用既有列不新增列）+ 发现/查询/Schema 获取接口（ROADMAP P1-4）"

[dependencies]
database = { workspace = true }
domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# JSON Schema draft 2020-12 校验（TOOL-CONTRACT 2.5 第 3/8 条）：复用维护中的
# 成熟实现，不手写子集校验器；default-features 关闭远程与文件 $ref 解析，
# 工具 Schema 均为内联文档，外部引用在编译期即拒绝（fail-closed）。
# 版本钉在 0.56：全局门禁环境的 crates.io 走 rsproxy.cn 镜像，其索引对
# jsonschema 只镜像到 0.56.0（上游 0.61 镜像滞后），lock/ld vendor 与镜像
# 两条解析路径保持一致。
jsonschema = { version = "0.56", default-features = false }
# SHA-256（content_hash，2.5 第 9 条）：复用 RustCrypto 稳定线实现。
sha2 = "0.10"
serde_yaml_ng = { workspace = true }

[[bin]]
name = "rp-tool"
path = "src/bin/rp-tool.rs"
